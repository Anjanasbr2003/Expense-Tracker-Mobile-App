<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#030805" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="description" content="Fast, offline-first personal mobile expense tracker" />
    <title>SpendWise</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
      }
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #030805;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .splash-pulse {
        animation: splashPulse 2s ease-in-out infinite alternate;
      }
      @keyframes splashPulse {
        0% { transform: scale(0.96); opacity: 0.85; }
        100% { transform: scale(1.04); opacity: 1; }
      }
    </style>
    <script>
      // Instantly apply saved theme BEFORE any paint to prevent white/dark flash
      (function() {
        var isDark = true; // default to dark
        try {
          var saved = localStorage.getItem('spendwise_settings');
          if (saved) {
            var s = JSON.parse(saved);
            if (s.theme === 'light') isDark = false;
            else if (s.theme === 'dark') isDark = true;
            else isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
        } catch(e) {}
        var root = document.documentElement;
        if (isDark) {
          root.classList.add('dark');
          root.style.backgroundColor = '#030805';
          root.style.colorScheme = 'dark';
        } else {
          root.classList.remove('dark');
          root.style.backgroundColor = '#f8fafc';
          root.style.colorScheme = 'light';
        }
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-emerald-500 selection:text-white">
    <div id="root" class="h-full w-full">
      <!-- Instant 0ms branded SpendWise splash (replaces blank screen before JS executes) -->
      <div id="app-splash">
        <div style="position: absolute; top: 38%; left: 50%; transform: translate(-50%, -50%); width: 280px; height: 280px; border-radius: 9999px; background: radial-gradient(circle, rgba(34,197,94,0.22) 0%, rgba(16,185,129,0.06) 50%, transparent 70%); pointer-events: none;"></div>
        <div class="splash-pulse" style="position: relative; width: 80px; height: 80px; border-radius: 24px; background: linear-gradient(135deg, #10b981 0%, #059669 50%, #047857 100%); display: flex; align-items: center; justify-content: center; box-shadow: 0 12px 36px rgba(16,185,129,0.35), 0 0 0 1px rgba(255,255,255,0.15); margin-bottom: 20px;">
          <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1" />
            <path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4" />
          </svg>
        </div>
        <h1 style="font-size: 24px; font-weight: 800; color: #ffffff; letter-spacing: -0.5px; margin: 0 0 6px 0;">SpendWise</h1>
        <p style="font-size: 12px; font-weight: 600; color: #34d399; margin: 0; letter-spacing: 0.5px;">SMART EXPENSE TRACKER</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('SW registration skipped:', err);
          });
        });
      }
    </script>
  </body>
</html>
