<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sw-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a3e635" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="sw-wallet-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bef264" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="sw-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Dark Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="#040906" stroke="url(#sw-border-grad)" stroke-width="16" />

  <!-- SpendWise Wallet Emblem -->
  <g transform="translate(106, 116)" stroke="url(#sw-wallet-grad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Wallet Main Shell -->
    <path d="M22 64 C22 44, 38 28, 58 28 L242 28 C262 28, 278 44, 278 64 L278 216 C278 236, 262 252, 242 252 L58 252 C38 252, 22 236, 22 216 Z" fill="#061c11" />
    <!-- Wallet Top Accent Fold -->
    <path d="M22 92 L278 92" />
    <!-- Flap / Pocket -->
    <path d="M185 116 L278 116 L278 194 L185 194 C163 194, 146 177, 146 155 C146 133, 163 116, 185 116 Z" fill="#0b2e1b" stroke="url(#sw-wallet-grad)" stroke-width="20" />
    <!-- Clasp / Coin Button -->
    <circle cx="204" cy="155" r="14" fill="#bef264" stroke="#a3e635" stroke-width="6" />
  </g>
</svg>